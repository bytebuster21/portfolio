<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#1a1730" />
      <stop offset="100%" stop-color="#241b35" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect x="15" y="15" width="570" height="420" rx="16" fill="url(#pubBg)" stroke="url(#neonGrad)" stroke-width="2.5" />
  <rect x="25" y="25" width="550" height="400" rx="12" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />

  <!-- Research Paper Symbol / Graphic -->
  <g transform="translate(48, 50)">
    <rect width="40" height="50" rx="4" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1.5" />
    <line x1="8" y1="14" x2="32" y2="14" stroke="#8b5cf6" stroke-width="2" />
    <line x1="8" y1="22" x2="32" y2="22" stroke="#8b5cf6" stroke-width="2" />
    <line x1="8" y1="30" x2="24" y2="30" stroke="#8b5cf6" stroke-width="2" />
  </g>

  <!-- Status Pill -->
  <g transform="translate(410, 48)">
    <rect width="140" height="28" rx="14" fill="rgba(244,63,94,0.15)" stroke="#f43f5e" stroke-width="1" />
    <text x="70" y="18" text-anchor="middle" fill="#fb7185" font-family="'Poppins', sans-serif" font-size="11" font-weight="700">SUBMITTED PAPER</text>
  </g>

  <!-- Titles -->
  <text x="50" y="140" fill="#a5b4fc" font-family="'Poppins', sans-serif" font-size="12" letter-spacing="2" font-weight="600">RESEARCH PUBLICATION</text>
  <text x="50" y="172" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="19" font-weight="700">Intelligent Hydraulic System Monitoring</text>
  
  <text x="50" y="202" fill="#cbd5e1" font-family="'Poppins', sans-serif" font-size="13" font-weight="400">via Masked Attention Pooling &amp; Threshold-Specific</text>
  <text x="50" y="224" fill="#cbd5e1" font-family="'Poppins', sans-serif" font-size="13" font-weight="400">Ordinal Regression for Real-Time Anomaly Detection</text>

  <line x1="50" y1="248" x2="550" y2="248" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <text x="50" y="280" fill="#94a3b8" font-family="'Poppins', sans-serif" font-size="13">Journal:</text>
  <text x="110" y="280" fill="#e2e8f0" font-family="'Poppins', sans-serif" font-size="13" font-weight="600">Turkish Journal of Electrical Engineering &amp; Computer Sciences</text>

  <text x="50" y="315" fill="#94a3b8" font-family="'Poppins', sans-serif" font-size="13">Manuscript No:</text>
  <text x="160" y="315" fill="#38bdf8" font-family="'Poppins', sans-serif" font-size="13" font-weight="600">TJEECS-2025-01804</text>

  <!-- Sensor Streaming Wave Graphic -->
  <g transform="translate(50, 345)">
    <path d="M 0 30 Q 30 5, 60 30 T 120 30 T 180 30 T 240 30 T 300 30 T 360 30 T 420 30 T 500 30" fill="none" stroke="url(#neonGrad)" stroke-width="3" />
    <circle cx="240" cy="30" r="5" fill="#f43f5e" />
    <circle cx="360" cy="30" r="5" fill="#38bdf8" />
  </g>
</svg>
