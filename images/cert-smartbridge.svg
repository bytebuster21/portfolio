<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48cfad" />
      <stop offset="100%" stop-color="#6c63ff" />
    </linearGradient>
  </defs>

  <!-- Border & Frame -->
  <rect x="15" y="15" width="570" height="420" rx="16" fill="url(#certBg)" stroke="url(#goldGrad)" stroke-width="3" />
  <rect x="25" y="25" width="550" height="400" rx="12" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Google colors decorative dots -->
  <circle cx="50" cy="50" r="6" fill="#4285F4" />
  <circle cx="68" cy="50" r="6" fill="#EA4335" />
  <circle cx="86" cy="50" r="6" fill="#FBBC05" />
  <circle cx="104" cy="50" r="6" fill="#34A853" />

  <!-- Badge Icon Top Right -->
  <g transform="translate(490, 45)">
    <circle cx="25" cy="25" r="22" fill="rgba(108,99,255,0.2)" stroke="#6c63ff" stroke-width="2" />
    <path d="M 25 15 L 28 22 L 35 23 L 30 28 L 31 35 L 25 31 L 19 35 L 20 28 L 15 23 L 22 22 Z" fill="#48cfad" />
  </g>

  <!-- Content -->
  <text x="300" y="105" text-anchor="middle" fill="#a5b4fc" font-family="'Poppins', sans-serif" font-size="13" letter-spacing="3" font-weight="600">CERTIFICATE OF TRAINING</text>
  <text x="300" y="150" text-anchor="middle" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="24" font-weight="700">Artificial Intelligence</text>
  
  <line x1="200" y1="170" x2="400" y2="170" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />

  <text x="300" y="210" text-anchor="middle" fill="#94a3b8" font-family="'Poppins', sans-serif" font-size="13">Awarded to</text>
  <text x="300" y="245" text-anchor="middle" fill="#38bdf8" font-family="'Poppins', sans-serif" font-size="22" font-weight="700">Mehak Wadhwa</text>

  <text x="300" y="285" text-anchor="middle" fill="#cbd5e1" font-family="'Poppins', sans-serif" font-size="12">In collaboration with</text>
  <text x="300" y="315" text-anchor="middle" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="16" font-weight="600">SmartBridge &amp; Google for Developers</text>

  <g transform="translate(140, 350)">
    <rect width="320" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(108,99,255,0.3)" />
    <text x="160" y="23" text-anchor="middle" fill="#48cfad" font-family="'Poppins', sans-serif" font-size="12" font-weight="600">Deep Learning • TensorFlow • Cloud AI</text>
  </g>
</svg>
