<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="vitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="vitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect x="15" y="15" width="570" height="420" rx="16" fill="url(#vitBg)" stroke="url(#vitGrad)" stroke-width="2.5" />
  <rect x="25" y="25" width="550" height="400" rx="12" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />

  <!-- Graduation Cap Icon -->
  <g transform="translate(48, 50)">
    <circle cx="24" cy="24" r="22" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 12 24 L 24 18 L 36 24 L 24 30 Z" fill="#38bdf8" />
    <path d="M 18 27 L 18 33 Q 24 36, 30 33 L 30 27" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <text x="50" y="140" fill="#93c5fd" font-family="'Poppins', sans-serif" font-size="12" letter-spacing="2" font-weight="600">ACADEMIC EXCELLENCE</text>
  <text x="50" y="175" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="22" font-weight="700">Vellore Institute of Technology (VIT)</text>
  <text x="50" y="205" fill="#cbd5e1" font-family="'Poppins', sans-serif" font-size="14" font-weight="500">B.Tech in Computer Science &amp; Engineering (Bioinformatics)</text>

  <line x1="50" y1="235" x2="550" y2="235" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- CGPA Badge -->
  <g transform="translate(50, 260)">
    <rect width="180" height="60" rx="12" fill="rgba(99,102,241,0.15)" stroke="#6366f1" stroke-width="1.5" />
    <text x="20" y="26" fill="#94a3b8" font-family="'Poppins', sans-serif" font-size="11">CUMULATIVE GPA</text>
    <text x="20" y="50" fill="#38bdf8" font-family="'Poppins', sans-serif" font-size="20" font-weight="700">8.64 / 10.0</text>
  </g>

  <!-- Duration Badge -->
  <g transform="translate(250, 260)">
    <rect width="180" height="60" rx="12" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="26" fill="#94a3b8" font-family="'Poppins', sans-serif" font-size="11">GRADUATION BATCH</text>
    <text x="20" y="50" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="16" font-weight="600">July 2023 – 2027</text>
  </g>

  <text x="50" y="365" fill="#94a3b8" font-family="'Poppins', sans-serif" font-size="13">Campus: <tspan fill="#e2e8f0" font-weight="600">Vellore, Tamil Nadu, India</tspan></text>
</svg>
